name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install verification tools
        run: python -m pip install --upgrade build mypy pip-audit ruff
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests examples
      - name: Build package
        run: python -m build
      - name: Package smoke test
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --no-index dist/*.whl
          .smoke-venv/bin/distpeek --version
          .smoke-venv/bin/distpeek inspect dist/*.whl --require distpeek/__init__.py --format json > smoke-report.json
      - name: Dependency audit
        run: pip-audit --local
      - name: Whitespace check
        run: git diff --check
